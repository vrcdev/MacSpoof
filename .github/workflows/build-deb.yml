name: build-deb

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ldid dpkg

      - name: Install theos
        run: git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS SDKs
        run: git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: Build rootless package
        run: make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: macspoof-deb
          path: packages/*.deb
